<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>NEXORA CORE</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#010409;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

/* BACKGROUND */

.background{
    position:fixed;
    inset:0;
    background:
        radial-gradient(
            circle at center,
            #08374d 0%,
            #041725 25%,
            #020912 55%,
            #000 100%
        );
}

.background:before{
    content:"";
    position:absolute;
    inset:-50%;
    background:
        radial-gradient(
            circle,
            rgba(0,220,255,.16),
            transparent 45%
        );
    animation:bgmove 12s infinite alternate;
}

.stars{
    position:absolute;
    inset:0;
    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.8) 1px,
            transparent 1px
        );
    background-size:90px 90px;
    opacity:.12;
    animation:stars 40s linear infinite;
}

@keyframes bgmove{
    from{transform:translate(-5%,-3%)}
    to{transform:translate(5%,3%)}
}

@keyframes stars{
    from{transform:translate(0,0)}
    to{transform:translate(90px,90px)}
}

/* SCANLINES */

.scanlines{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:100;
    background:
        repeating-linear-gradient(
            0deg,
            transparent,
            transparent 3px,
            rgba(0,220,255,.018) 4px
        );
}

/* STATUS */

.status{
    position:fixed;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    font:9px monospace;
    letter-spacing:3px;
    color:#39ff9b;
    z-index:30;
}

/* CORE */

.main{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

.core-system{
    position:relative;
    width:min(80vw,380px);
    height:min(80vw,380px);
    display:flex;
    align-items:center;
    justify-content:center;
}

/* RINGS */

.ring-one{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1px solid rgba(0,220,255,.35);
    box-shadow:0 0 35px rgba(0,180,255,.15);
    animation:rotate 14s linear infinite;
}

.ring-two{
    position:absolute;
    inset:8%;
    border-radius:50%;
    border:2px solid rgba(0,230,255,.45);
    border-left-color:transparent;
    border-right-color:transparent;
    animation:rotateReverse 7s linear infinite;
}

.ring-three{
    position:absolute;
    inset:14%;
    border-radius:50%;
    border:1px dashed rgba(0,220,255,.5);
    animation:rotate 10s linear infinite;
}

.ticks{
    position:absolute;
    inset:5%;
    border-radius:50%;
    background:
        repeating-conic-gradient(
            rgba(0,220,255,.7) 0deg 1deg,
            transparent 1deg 10deg
        );

    -webkit-mask:
        radial-gradient(
            transparent 68%,
            black 69%,
            black 70%,
            transparent 71%
        );

    mask:
        radial-gradient(
            transparent 68%,
            black 69%,
            black 70%,
            transparent 71%
        );

    animation:rotateReverse 20s linear infinite;
}

/* BLUE CORE */

.core{
    position:absolute;

    width:40%;
    height:40%;

    min-width:105px;
    min-height:105px;

    max-width:155px;
    max-height:155px;

    border-radius:50%;

    cursor:pointer;
    touch-action:manipulation;

    background:
        radial-gradient(
            circle,
            #fff 0%,
            #c8ffff 5%,
            #00f2ff 14%,
            #00a8e8 28%,
            #07518b 48%,
            rgba(0,50,90,.3) 68%,
            transparent 75%
        );

    border:2px solid #bfffff;

    box-shadow:
        0 0 10px white,
        0 0 25px #00eaff,
        0 0 60px #009cff,
        0 0 110px rgba(0,140,255,.8),
        inset 0 0 35px white;

    animation:pulse 3s infinite;
}

.core.active{
    transform:scale(1.08);
}

.core.listening{
    animation:listening .55s infinite alternate;
}

.core.thinking{
    animation:thinking .25s infinite alternate;
}

@keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.04)}
}

@keyframes listening{
    from{transform:scale(1.03)}
    to{transform:scale(1.16)}
}

@keyframes thinking{
    from{filter:brightness(1)}
    to{filter:brightness(2)}
}

@keyframes rotate{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

@keyframes rotateReverse{
    from{transform:rotate(360deg)}
    to{transform:rotate(0deg)}
}

/* NAME */

.core-label{
    position:absolute;
    bottom:-65px;
    width:100%;
    text-align:center;
    pointer-events:none;
}

.nexora-name{
    font-size:clamp(18px,5vw,26px);
    letter-spacing:clamp(5px,2vw,10px);
    color:#e8fdff;
    text-shadow:
        0 0 8px #00eaff,
        0 0 25px #0077ff;
}

/* MESSAGE */

.ai{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    width:min(650px,88vw);
    text-align:center;
    z-index:30;
}

.message{
    font-size:clamp(10px,3vw,14px);
    color:#d7faff;
    text-shadow:0 0 12px rgba(0,220,255,.6);
}

/* QR BUTTON */

.qr-button{
    position:fixed;
    right:18px;
    bottom:18px;

    width:58px;
    height:58px;

    border-radius:50%;

    border:1px solid #00eaff;

    background:rgba(0,20,35,.92);

    color:#a9f8ff;

    font-size:24px;

    cursor:pointer;
    z-index:60;

    box-shadow:
        0 0 20px
        rgba(0,220,255,.45);
}

/* QR WINDOW */

.qr-window{
    position:fixed;
    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.9);

    backdrop-filter:blur(15px);

    z-index:200;
}

.qr-window.show{
    display:flex;
}

/* QR PANEL */

.qr-panel{
    width:min(380px,94vw);

    padding:25px;

    text-align:center;

    border:1px solid #00eaff;

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            #061c2c,
            #01070d
        );

    box-shadow:
        0 0 70px
        rgba(0,210,255,.35);
}

.qr-panel h2{
    color:#b8faff;
    letter-spacing:5px;
    margin-bottom:10px;
}

.qr-panel p{
    color:#789aa8;
    font-size:12px;
    line-height:1.6;
    margin-bottom:18px;
}

/* QR */

#qrcode{
    width:220px;
    height:220px;

    margin:auto;

    padding:10px;

    background:white;

    display:flex;
    align-items:center;
    justify-content:center;
}

#qrcode img,
#qrcode canvas{
    max-width:100%;
    max-height:100%;
}

/* URL */

.qr-url{
    margin-top:15px;

    padding:10px;

    font:9px monospace;

    color:#75dcec;

    background:rgba(0,0,0,.4);

    overflow:hidden;

    white-space:nowrap;
}

/* BUTTONS */

.qr-controls{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:18px;
}

.qr-controls button{
    padding:10px 18px;

    border:1px solid #00eaff;

    border-radius:20px;

    background:transparent;

    color:#a9f8ff;

    cursor:pointer;
}

/* MOBILE */

@media(max-width:700px){

    .status{
        top:13px;
        font-size:7px;
        letter-spacing:2px;
    }

    .core-system{
        width:74vw;
        height:74vw;
    }

    .core-label{
        bottom:-52px;
    }

    .qr-button{
        width:50px;
        height:50px;
        right:14px;
        bottom:14px;
        font-size:21px;
    }

    .ai{
        bottom:14px;
    }
}

/* SMALL PHONE */

@media(max-width:400px){

    .core-system{
        width:70vw;
        height:70vw;
    }

    .core{
        min-width:92px;
        min-height:92px;
    }

    .nexora-name{
        font-size:17px;
        letter-spacing:5px;
    }

    .message{
        font-size:10px;
    }
}

/* LANDSCAPE */

@media(max-height:500px){

    .core-system{
        width:55vh;
        height:55vh;
    }

    .ai{
        display:none;
    }
}

</style>
</head>

<body>

<div class="background">
    <div class="stars"></div>
</div>

<div class="scanlines"></div>

<div
    class="status"
    id="connection">
    ● CORE STANDBY
</div>

<main class="main">

    <div class="core-system">

        <div class="ring-one"></div>
        <div class="ring-two"></div>
        <div class="ring-three"></div>
        <div class="ticks"></div>

        <div
            class="core"
            id="core"
            role="button"
            tabindex="0"
            aria-label="Activate NEXORA">
        </div>

        <div class="core-label">

            <div class="nexora-name">
                NEXORA
            </div>

        </div>

    </div>

</main>

<div class="ai">

    <div
        class="message"
        id="message">

        Tap NEXORA to activate.

    </div>

</div>

<button
    class="qr-button"
    id="qrButton"
    aria-label="Show NEXORA QR code">

    ▦

</button>

<!-- QR WINDOW -->

<div
    class="qr-window"
    id="qrWindow">

    <div class="qr-panel">

        <h2>NEXORA</h2>

        <p>
            Scan this QR code to open
            the live NEXORA website.
        </p>

        <div id="qrcode"></div>

        <div
            class="qr-url"
            id="qrURL">
        </div>

        <div class="qr-controls">

            <button id="copyURL">
                COPY LINK
            </button>

            <button id="closeQR">
                CLOSE
            </button>

        </div>

    </div>

</div>


<!-- QR CODE LIBRARY -->

<script src=
"https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
</script>


<script>

/* =====================================================
   NEXORA ENGINE
===================================================== */

const core =
    document.getElementById("core");

const message =
    document.getElementById("message");

const connection =
    document.getElementById("connection");

const qrWindow =
    document.getElementById("qrWindow");

const qrBox =
    document.getElementById("qrcode");


let active = false;
let listening = false;


/* =====================================================
   NEXORA VOICE
===================================================== */

function speak(text){

    if(
        !("speechSynthesis" in window)
    ){

        return;
    }

    speechSynthesis.cancel();

    const voice =
        new SpeechSynthesisUtterance(text);

    voice.rate = 0.9;
    voice.pitch = 0.78;
    voice.volume = 1;

    speechSynthesis.speak(
        voice
    );
}


/* =====================================================
   RESPOND
===================================================== */

function respond(text){

    message.innerText =
        text;

    speak(text);
}


/* =====================================================
   ACTIVATE NEXORA
===================================================== */

function activateNexora(){

    if(active){

        startListening();

        return;
    }

    active = true;

    core.classList.add(
        "active"
    );

    connection.innerText =
        "● CORE ONLINE";

    respond(
        "NEXORA online. " +
        "Ask me a question or give me a command."
    );

    setTimeout(
        startListening,
        2200
    );
}


/* =====================================================
   BROWSER VOICE RECOGNITION
===================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;


if(SpeechRecognition){

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "en-US";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.maxAlternatives =
        1;


    recognition.onstart =
        function(){

            listening = true;

            core.classList.remove(
                "thinking"
            );

            core.classList.add(
                "listening"
            );

            connection.innerText =
                "● LISTENING";

            message.innerText =
                "Listening...";
        };


    recognition.onresult =
        function(event){

            const command =
                event
                .results[0][0]
                .transcript
                .toLowerCase()
                .trim();

            listening = false;

            core.classList.remove(
                "listening"
            );

            core.classList.add(
                "thinking"
            );

            connection.innerText =
                "● PROCESSING";

            message.innerText =
                command;

            processCommand(
                command
            );
        };


    recognition.onend =
        function(){

            listening = false;

            core.classList.remove(
                "listening"
            );

            if(active){

                connection.innerText =
                    "● CORE ONLINE";
            }
        };


    recognition.onerror =
        function(event){

            listening = false;

            core.classList.remove(
                "listening",
                "thinking"
            );

            connection.innerText =
                active
                ? "● CORE ONLINE"
                : "● CORE STANDBY";


            if(
                event.error ===
                "not-allowed"
            ){

                respond(
                    "Microphone access was denied. " +
                    "Please allow microphone access."
                );
            }

            else if(
                event.error ===
                "no-speech"
            ){

                message.innerText =
                    "I didn't hear anything.";

                if(active){

                    setTimeout(
                        startListening,
                        1000
                    );
                }
            }

            else{

                respond(
                    "Voice recognition encountered an error."
                );
            }
        };
}


/* =====================================================
   START LISTENING
===================================================== */

function startListening(){

    if(!recognition){

        respond(
            "Voice recognition is not supported here. " +
            "Please use Chrome or Microsoft Edge."
        );

        return;
    }

    if(listening){

        return;
    }

    try{

        recognition.start();

    }

    catch(error){

        console.log(
            error
        );
    }
}


/* =====================================================
   COMMAND PROCESSOR
===================================================== */

function processCommand(command){

    let answer = null;

    let website = null;


    /* GREETING */

    if(
        command.includes("hello") ||
        command.includes("hi") ||
        command.includes("hey")
    ){

        answer =
            "Hello. NEXORA is ready.";
    }


    /* IDENTITY */

    else if(
        command.includes("who are you") ||
        command.includes("what are you")
    ){

        answer =
            "I am NEXORA, " +
            "a digital intelligence interface.";
    }


    /* CAPABILITIES */

    else if(
        command.includes("what can you do") ||
        command === "help"
    ){

        answer =
            "I can answer questions, " +
            "search the web, calculate mathematics, " +
            "open websites and control the NEXORA interface.";
    }


    /* TIME */

    else if(
        command.includes("what time") ||
        command.includes("time is it") ||
        command === "time"
    ){

        answer =
            "The current time is " +
            new Date().toLocaleTimeString();
    }


    /* DATE */

    else if(
        command.includes("what date") ||
        command.includes("what day") ||
        command.includes("today")
    ){

        answer =
            "Today is " +
            new Date().toLocaleDateString(
                undefined,
                {
                    weekday:"long",
                    year:"numeric",
                    month:"long",
                    day:"numeric"
                }
            );
    }


    /* STATUS */

    else if(
        command.includes("status") ||
        command.includes("system status")
    ){

        answer =
            "All NEXORA systems are operational. " +
            "Core integrity is one hundred percent.";
    }


    /* SCAN */

    else if(
        command.includes("scan") ||
        command.includes("diagnostic")
    ){

        answer =
            "Diagnostic scan complete. " +
            "No critical issues detected.";
    }


    /* ROBOTICS */

    else if(
        command.includes("robot") ||
        command.includes("robotics")
    ){

        answer =
            "Robotics systems are ready.";
    }


    /* SCIENCE */

    else if(
        command.includes("science")
    ){

        answer =
            "Science systems are online.";
    }


    /* MATHEMATICS */

    else if(
        command.includes("math") ||
        command.includes("mathematics")
    ){

        answer =
            "Mathematics systems are ready.";
    }


    /* MISSION */

    else if(
        command.includes("mission")
    ){

        answer =
            "Mission systems are ready.";
    }


    /* OPEN GOOGLE */

    else if(
        command.includes("open google")
    ){

        answer =
            "Opening Google.";

        website =
            "https://www.google.com";
    }


    /* OPEN YOUTUBE */

    else if(
        command.includes("open youtube")
    ){

        answer =
            "Opening YouTube.";

        website =
            "https://www.youtube.com";
    }


    /* OPEN WIKIPEDIA */

    else if(
        command.includes("open wikipedia")
    ){

        answer =
            "Opening Wikipedia.";

        website =
            "https://www.wikipedia.org";
    }


    /* SEARCH */

    else if(
        command.startsWith("search for ")
    ){

        const query =
            command.replace(
                "search for ",
                ""
            );

        answer =
            "Searching for " +
            query + ".";

        website =
            "https://www.google.com/search?q=" +
            encodeURIComponent(
                query
            );
    }


    /* CALCULATOR */

    else if(
        command.startsWith("calculate ")
    ){

        const expression =
            command.replace(
                "calculate ",
                ""
            );

        if(
            /^[0-9+\-*/().%\s]+$/
            .test(expression)
        ){

            try{

                const result =
                    Function(
                        '"use strict";return (' +
                        expression +
                        ')'
                    )();

                answer =
                    "The answer is " +
                    result;

            }

            catch{

                answer =
                    "I could not calculate that.";
            }

        }

        else{

            answer =
                "I can only calculate mathematical expressions.";
        }
    }


    /* JOKE */

    else if(
        command.includes(
            "tell me a joke"
        )
    ){

        answer =
            "Why did the computer go to the doctor? " +
            "Because it had a virus.";
    }


    /* STOP */

    else if(
        command.includes(
            "stop listening"
        ) ||
        command.includes(
            "enter standby"
        )
    ){

        active = false;

        if(recognition){

            try{
                recognition.stop();
            }
            catch(error){}
        }

        core.classList.remove(
            "active",
            "listening",
            "thinking"
        );

        connection.innerText =
            "● CORE STANDBY";

        answer =
            "NEXORA entering standby.";
    }


    /* UNKNOWN QUESTION */

    else{

        answer =
            "I don't know that yet. " +
            "I'll search the web for you.";

        website =
            "https://www.google.com/search?q=" +
            encodeURIComponent(
                command
            );
    }


    respond(
        answer
    );


    core.classList.remove(
        "thinking"
    );


    if(website){

        setTimeout(

            function(){

                window.open(
                    website,
                    "_blank",
                    "noopener"
                );

            },

            900
        );
    }


    if(active){

        setTimeout(
            startListening,
            3500
        );
    }
}


/* =====================================================
   QR CODE
===================================================== */

function generateQR(){

    qrBox.innerHTML = "";

    const websiteURL =
        window.location.href;


    /*
       If opened locally, the QR will contain
       a file:/// address. It will only become
       phone-accessible after the website is hosted.
    */

    new QRCode(
        qrBox,
        {
            text:websiteURL,

            width:200,

            height:200,

            colorDark:"#000000",

            colorLight:"#ffffff",

            correctLevel:
                QRCode.CorrectLevel.H
        }
    );
}


/* =====================================================
   OPEN QR
===================================================== */

document
    .getElementById("qrButton")
    .onclick =
    function(){

        document
            .getElementById("qrURL")
            .innerText =
                window.location.href;

        qrWindow.classList.add(
            "show"
        );

        generateQR();
    };


/* =====================================================
   CLOSE QR
===================================================== */

document
    .getElementById("closeQR")
    .onclick =
    function(){

        qrWindow.classList.remove(
            "show"
        );
    };


/* =====================================================
   COPY URL
===================================================== */

document
    .getElementById("copyURL")
    .onclick =
    async function(){

        try{

            await navigator.clipboard
                .writeText(
                    window.location.href
                );

            message.innerText =
                "NEXORA link copied.";

        }

        catch{

            message.innerText =
                window.location.href;
        }
    };


/* =====================================================
   CLOSE QR BY CLICKING OUTSIDE
===================================================== */

qrWindow.onclick =
    function(event){

        if(
            event.target ===
            qrWindow
        ){

            qrWindow.classList.remove(
                "show"
            );
        }
    };


/* =====================================================
   ESCAPE
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Escape"
        ){

            qrWindow.classList.remove(
                "show"
            );
        }
    }
);


/* =====================================================
   CORE KEYBOARD ACCESS
===================================================== */

core.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" ||
            event.key === " "
        ){

            event.preventDefault();

            activateNexora();
        }
    }
);

</script>

</body>
</html>

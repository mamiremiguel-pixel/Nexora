<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020812">
<title>NEXORA CORE</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at center,
        #0b426b 0%,
        #06243d 25%,
        #020d19 55%,
        #01050a 100%);
    color:#e8fbff;
}

/* BACKGROUND */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(rgba(0,190,255,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,190,255,.035) 1px,transparent 1px);
    background-size:45px 45px;
}

/* MAIN */

.main{
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

/* CORE */

.core{
    width:285px;
    height:285px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:.35s;
}

.core:hover{
    transform:scale(1.04);
}

.core:active{
    transform:scale(.98);
}

.ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:2px solid rgba(0,210,255,.65);
    box-shadow:
        0 0 18px #00bfff,
        inset 0 0 28px rgba(0,190,255,.25);
    animation:rotate 10s linear infinite;
}

.ring:nth-child(2){
    inset:18px;
    border-color:rgba(85,225,255,.45);
    animation-direction:reverse;
    animation-duration:7s;
}

.ring:nth-child(3){
    inset:39px;
    border-style:dashed;
    animation-duration:5s;
}

.center{
    width:108px;
    height:108px;
    border-radius:50%;
    background:
        radial-gradient(circle,
        #ffffff 0%,
        #9cefff 18%,
        #14b8ee 42%,
        #00618e 68%,
        #001625 100%);

    box-shadow:
        0 0 28px #00d9ff,
        0 0 75px rgba(0,200,255,.75),
        inset 0 0 25px white;

    animation:pulse 2s infinite;
}

.core.active .center{
    animation:activePulse .65s infinite;

    box-shadow:
        0 0 40px #00eaff,
        0 0 120px #00bfff,
        inset 0 0 32px white;
}

.core.active .ring{
    animation-duration:2s;
}

/* ORBITS */

.orbit{
    position:absolute;
    border-radius:50%;
    border:1px solid rgba(0,210,255,.22);
    pointer-events:none;
}

.orbit.one{
    width:365px;
    height:190px;
    transform:rotate(25deg);
    animation:orbitOne 8s linear infinite;
}

.orbit.two{
    width:190px;
    height:365px;
    transform:rotate(-25deg);
    animation:orbitTwo 10s linear infinite;
}

/* BIG NEXORA */

.title{
    position:absolute;
    top:calc(50% + 180px);
    left:50%;
    transform:translateX(-50%);

    font-size:34px;
    font-weight:700;
    letter-spacing:10px;

    color:#a5efff;
    text-shadow:
        0 0 10px #00bfff,
        0 0 25px rgba(0,190,255,.8);

    white-space:nowrap;

    pointer-events:none;
}

/* CURRENT MODE */

.mode-display{
    position:absolute;
    top:calc(50% + 225px);
    left:50%;
    transform:translateX(-50%);

    font-size:11px;
    letter-spacing:3px;
    color:#6bb9d2;

    white-space:nowrap;
    pointer-events:none;
}

/* TOP RIGHT BUTTON */

.voice-button{
    position:fixed;
    top:20px;
    right:20px;

    width:52px;
    height:52px;

    border-radius:50%;
    border:1px solid rgba(0,215,255,.6);

    background:rgba(3,28,45,.85);
    color:white;

    font-size:21px;
    cursor:pointer;

    z-index:50;

    box-shadow:
        0 0 18px rgba(0,190,255,.25);

    transition:.25s;
}

.voice-button:hover{
    box-shadow:
        0 0 30px #00cfff;
}

.voice-button.active{
    background:#006e91;
    box-shadow:
        0 0 30px #00eaff;
}

/* PANEL */

.panel{
    position:fixed;

    top:85px;
    right:20px;

    width:300px;
    max-height:calc(100vh - 105px);

    overflow-y:auto;

    padding:19px;

    border-radius:20px;

    background:rgba(2,13,24,.96);

    border:1px solid rgba(0,205,255,.35);

    box-shadow:
        0 0 35px rgba(0,170,255,.2);

    backdrop-filter:blur(18px);

    z-index:40;

    transform:translateX(340px);
    transition:.35s;
}

.panel.open{
    transform:translateX(0);
}

.panel-title{
    color:#7ce7ff;
    font-size:16px;
    letter-spacing:2px;
    margin-bottom:17px;
}

/* MODE */

.mode-label{
    display:block;
    color:#73b9ce;
    font-size:11px;
    letter-spacing:1px;
    margin-bottom:7px;
}

.mode-select{
    width:100%;
    padding:11px;

    border-radius:10px;

    border:1px solid #117da4;

    background:#061d2e;
    color:white;

    margin-bottom:17px;
}

/* CONTROLS */

.control-label{
    display:block;
    color:#73b9ce;
    font-size:11px;
    margin-bottom:7px;
}

input[type="range"]{
    width:100%;
    margin-bottom:16px;
}

.panel-button{
    width:100%;
    padding:10px;

    border-radius:10px;

    border:1px solid #0a9fd3;

    background:#063d5a;
    color:white;

    cursor:pointer;

    margin-top:5px;

    transition:.2s;
}

.panel-button:hover{
    background:#075d80;
    box-shadow:0 0 15px rgba(0,210,255,.3);
}

/* QR */

.qr{
    display:none;

    margin-top:13px;

    justify-content:center;

    padding:10px;

    background:white;

    border-radius:10px;
}

/* STATUS */

.status{
    position:fixed;
    left:20px;
    bottom:20px;

    width:9px;
    height:9px;

    border-radius:50%;

    background:#00ff9d;

    box-shadow:0 0 14px #00ff9d;

    z-index:10;
}

.status.listening{
    background:#00d9ff;
    box-shadow:0 0 18px #00d9ff;
}

/* ANIMATIONS */

@keyframes rotate{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }
}

@keyframes activePulse{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.18);
    }
}

@keyframes orbitOne{
    from{
        transform:rotate(25deg);
    }

    to{
        transform:rotate(385deg);
    }
}

@keyframes orbitTwo{
    from{
        transform:rotate(-25deg);
    }

    to{
        transform:rotate(-385deg);
    }
}

/* MOBILE */

@media(max-width:600px){

    .core{
        width:220px;
        height:220px;
    }

    .center{
        width:84px;
        height:84px;
    }

    .orbit.one{
        width:285px;
        height:150px;
    }

    .orbit.two{
        width:150px;
        height:285px;
    }

    .title{
        top:calc(50% + 145px);
        font-size:27px;
        letter-spacing:7px;
    }

    .mode-display{
        top:calc(50% + 185px);
        font-size:9px;
    }

    .panel{
        width:calc(100% - 30px);
        right:15px;
        top:80px;
    }
}
</style>
</head>

<body>

<div class="main">

    <div class="core" id="core">

        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>

        <div class="orbit one"></div>
        <div class="orbit two"></div>

        <div class="center"></div>

    </div>

    <div class="title">
        NEXORA
    </div>

    <div class="mode-display" id="modeDisplay">
        NEXORA MODE
    </div>

</div>


<!-- STATUS LIGHT -->

<div class="status" id="status"></div>


<!-- VOICE / SETTINGS BUTTON -->

<button
    class="voice-button"
    id="voiceButton"
    title="Open NEXORA controls">
    🎙️
</button>


<!-- CONTROL PANEL -->

<div class="panel" id="panel">

    <div class="panel-title">
        NEXORA CONTROL
    </div>

    <!-- MODE -->

    <label class="mode-label">
        ASSISTANT MODE
    </label>

    <select
        class="mode-select"
        id="modeSelect">

        <option value="nexora">
            🔵 NEXORA
        </option>

        <option value="jarvis">
            ⚪ JARVIS-INSPIRED
        </option>

    </select>


    <!-- VOICE -->

    <label class="control-label">
        VOICE
    </label>

    <select
        class="mode-select"
        id="voiceSelect">
    </select>


    <!-- SPEED -->

    <label class="control-label">
        VOICE SPEED
    </label>

    <input
        id="rate"
        type="range"
        min="0.6"
        max="1.5"
        step="0.05"
        value="1">


    <!-- PITCH -->

    <label class="control-label">
        VOICE PITCH
    </label>

    <input
        id="pitch"
        type="range"
        min="0.5"
        max="1.5"
        step="0.05"
        value="1">


    <!-- TEST -->

    <button
        class="panel-button"
        id="testVoice">
        🔊 TEST VOICE
    </button>


    <!-- STOP -->

    <button
        class="panel-button"
        id="stopVoice">
        ⏹ STOP VOICE
    </button>


    <!-- QR -->

    <button
        class="panel-button"
        id="qrButton">
        📱 SHOW QR
    </button>

    <div
        class="qr"
        id="qr">
    </div>

</div>


<script>

/* =========================================
   NEXORA CORE v2.1
   ========================================= */

const core =
    document.getElementById("core");

const voiceButton =
    document.getElementById("voiceButton");

const panel =
    document.getElementById("panel");

const modeSelect =
    document.getElementById("modeSelect");

const modeDisplay =
    document.getElementById("modeDisplay");

const voiceSelect =
    document.getElementById("voiceSelect");

const rate =
    document.getElementById("rate");

const pitch =
    document.getElementById("pitch");

const status =
    document.getElementById("status");

let voices = [];

let listening = false;

let currentMode = "nexora";


/* =========================================
   LOAD VOICES
   ========================================= */

function loadVoices(){

    voices =
        window.speechSynthesis
        .getVoices();

    voiceSelect.innerHTML = "";

    voices.forEach(
        (voice,index)=>{

            const option =
                document.createElement(
                    "option"
                );

            option.value = index;

            option.textContent =
                voice.name +
                " — " +
                voice.lang;

            voiceSelect.appendChild(
                option
            );
        }
    );

    chooseBestVoice();
}


/* =========================================
   BEST VOICE
   ========================================= */

function chooseBestVoice(){

    if(!voices.length)
        return;

    let preferred;

    if(currentMode === "jarvis"){

        preferred =
            voices.findIndex(
                voice =>
                    /Daniel|George|David|UK English|Microsoft/i
                    .test(voice.name)
            );

    }else{

        preferred =
            voices.findIndex(
                voice =>
                    /Google|Microsoft|Samantha|Alex|English/i
                    .test(voice.name)
            );
    }

    if(preferred >= 0){

        voiceSelect.value =
            preferred;
    }
}


/* =========================================
   VOICES CAN LOAD LATE
   ========================================= */

speechSynthesis.onvoiceschanged =
    loadVoices;

loadVoices();


/* =========================================
   SPEAK
   ========================================= */

function speak(text){

    if(!("speechSynthesis" in window))
        return;

    speechSynthesis.cancel();

    const message =
        new SpeechSynthesisUtterance(
            text
        );

    const selected =
        voices[
            Number(
                voiceSelect.value
            )
        ];

    if(selected){

        message.voice =
            selected;

        message.lang =
            selected.lang;
    }

    message.rate =
        Number(rate.value);

    message.pitch =
        Number(pitch.value);

    message.volume = 1;

    speechSynthesis.speak(
        message
    );
}


/* =========================================
   MODE SWITCH
   ========================================= */

modeSelect.addEventListener(
    "change",
    function(){

        currentMode =
            this.value;

        if(currentMode === "jarvis"){

            modeDisplay.textContent =
                "JARVIS-INSPIRED MODE";

            chooseBestVoice();

            speak(
                "JARVIS-inspired mode activated. Systems ready."
            );

        }else{

            modeDisplay.textContent =
                "NEXORA MODE";

            chooseBestVoice();

            speak(
                "NEXORA mode activated. Ready."
            );
        }
    }
);


/* =========================================
   SPEECH RECOGNITION
   ========================================= */

const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

if(Recognition){

    recognition =
        new Recognition();

    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.lang = "en-US";


    recognition.onstart =
        function(){

            listening = true;

            core.classList.add(
                "active"
            );

            voiceButton.classList.add(
                "active"
            );

            status.classList.add(
                "listening"
            );
        };


    recognition.onresult =
        function(event){

            const command =
                event.results[0][0]
                .transcript
                .trim();

            processCommand(
                command
            );
        };


    recognition.onerror =
        function(event){

            console.log(
                "Speech error:",
                event.error
            );

            listening = false;

            core.classList.remove(
                "active"
            );

            voiceButton.classList.remove(
                "active"
            );

            status.classList.remove(
                "listening"
            );

            if(
                event.error ===
                "not-allowed"
            ){

                speak(
                    "Microphone permission is required."
                );

            }
        };


    recognition.onend =
        function(){

            listening = false;

            core.classList.remove(
                "active"
            );

            voiceButton.classList.remove(
                "active"
            );

            status.classList.remove(
                "listening"
            );
        };

}


/* =========================================
   START LISTENING
   ========================================= */

function startListening(){

    if(!recognition){

        speak(
            "Voice recognition is not supported by this browser."
        );

        return;
    }

    if(listening)
        return;

    try{

        recognition.start();

    }catch(error){

        console.log(error);

    }
}


/* =========================================
   CORE CLICK
   ========================================= */

core.addEventListener(
    "click",
    function(){

        if(listening){

            recognition.stop();

        }else{

            startListening();

        }
    }
);


/* =========================================
   PANEL
   ========================================= */

voiceButton.addEventListener(
    "click",
    function(){

        panel.classList.toggle(
            "open"
        );
    }
);


/* =========================================
   COMMAND ENGINE
   ========================================= */

function processCommand(command){

    const text =
        command
        .toLowerCase()
        .trim();


    /* GREETING */

    if(
        text.includes("hello") ||
        text.includes("hi nexora") ||
        text.includes("hello nexora") ||
        text === "hi"
    ){

        if(currentMode === "jarvis"){

            speak(
                "Good day. JARVIS-inspired mode is online and ready."
            );

        }else{

            speak(
                "Hello. NEXORA is online and ready."
            );
        }

        return;
    }


    /* NAME */

    if(
        text.includes("your name") ||
        text.includes("who are you")
    ){

        if(currentMode === "jarvis"){

            speak(
                "This is the JARVIS-inspired assistant mode operating through NEXORA CORE."
            );

        }else{

            speak(
                "I am NEXORA, your personal browser assistant."
            );
        }

        return;
    }


    /* TIME */

    if(
        text.includes("what time") ||
        text === "time" ||
        text.includes("current time")
    ){

        speak(
            "The current time is " +
            new Date()
            .toLocaleTimeString()
        );

        return;
    }


    /* DATE */

    if(
        text.includes("what date") ||
        text.includes("what day is it") ||
        text.includes("today's date")
    ){

        speak(
            "Today is " +
            new Date()
            .toLocaleDateString(
                undefined,
                {
                    weekday:"long",
                    month:"long",
                    day:"numeric",
                    year:"numeric"
                }
            )
        );

        return;
    }


    /* OPEN GOOGLE */

    if(
        text.includes("open google")
    ){

        speak(
            currentMode === "jarvis"
            ? "Opening Google."
            : "Opening Google."
        );

        setTimeout(
            function(){

                window.open(
                    "https://www.google.com",
                    "_blank"
                );

            },
            700
        );

        return;
    }


    /* OPEN YOUTUBE */

    if(
        text.includes("open youtube")
    ){

        speak(
            "Opening YouTube."
        );

        setTimeout(
            function(){

                window.open(
                    "https://www.youtube.com",
                    "_blank"
                );

            },
            700
        );

        return;
    }


    /* SEARCH */

    if(
        text.startsWith("search ") ||
        text.startsWith("search for ")
    ){

        let query =
            text
            .replace(
                "search for ",
                ""
            )
            .replace(
                "search ",
                ""
            )
            .trim();

        if(!query){

            speak(
                "What would you like me to search for?"
            );

            return;
        }

        speak(
            "Searching for " +
            query
        );

        setTimeout(
            function(){

                window.open(
                    "https://www.google.com/search?q=" +
                    encodeURIComponent(
                        query
                    ),
                    "_blank"
                );

            },
            700
        );

        return;
    }


    /* CALCULATOR */

    if(
        text.startsWith("calculate ") ||
        text.startsWith("work out ")
    ){

        let expression =
            text
            .replace(
                "calculate ",
                ""
            )
            .replace(
                "work out ",
                ""
            )
            .trim();


        expression =
            expression
            .replace(
                /plus/g,
                "+"
            )
            .replace(
                /minus/g,
                "-"
            )
            .replace(
                /times/g,
                "*"
            )
            .replace(
                /multiplied by/g,
                "*"
            )
            .replace(
                /divided by/g,
                "/"
            );


        if(
            /^[0-9+\-*/().%\s]+$/
            .test(expression)
        ){

            try{

                const result =
                    Function(
                        '"use strict";return (' +
                        expression +
                        ')'
                    )();

                speak(
                    expression +
                    " equals " +
                    result
                );

            }catch{

                speak(
                    "I couldn't calculate that."
                );
            }

        }else{

            speak(
                "I can calculate basic arithmetic."
            );
        }

        return;
    }


    /* JOKE */

    if(
        text.includes(
            "tell me a joke"
        )
    ){

        speak(
            "Why did the computer go to the doctor? Because it had a virus."
        );

        return;
    }


    /* HELP */

    if(
        text === "help" ||
        text.includes(
            "what can you do"
        )
    ){

        if(currentMode === "jarvis"){

            speak(
                "I can process voice commands, open websites, search the web, calculate numbers, report the time and date, and operate the NEXORA CORE interface."
            );

        }else{

            speak(
                "I can listen to voice commands, open websites, search the web, calculate numbers, and tell you the time and date."
            );
        }

        return;
    }


    /* STOP */

    if(
        text === "stop" ||
        text.includes(
            "stop talking"
        )
    ){

        speechSynthesis.cancel();

        return;
    }


    /* SWITCH TO JARVIS */

    if(
        text.includes(
            "switch to jarvis"
        ) ||
        text.includes(
            "activate jarvis"
        )
    ){

        modeSelect.value =
            "jarvis";

        modeSelect.dispatchEvent(
            new Event("change")
        );

        return;
    }


    /* SWITCH TO NEXORA */

    if(
        text.includes(
            "switch to nexora"
        ) ||
        text.includes(
            "activate nexora"
        )
    ){

        modeSelect.value =
            "nexora";

        modeSelect.dispatchEvent(
            new Event("change")
        );

        return;
    }


    /* UNKNOWN */

    if(currentMode === "jarvis"){

        speak(
            "Command received. I don't currently have an action for that request."
        );

    }else{

        speak(
            "I heard you say " +
            command +
            ". I don't have that command available yet."
        );
    }
}


/* =========================================
   TEST VOICE
   ========================================= */

document
.getElementById("testVoice")
.addEventListener(
    "click",
    function(){

        if(currentMode === "jarvis"){

            speak(
                "JARVIS-inspired voice system online."
            );

        }else{

            speak(
                "NEXORA voice system online."
            );
        }
    }
);


/* =========================================
   STOP VOICE
   ========================================= */

document
.getElementById("stopVoice")
.addEventListener(
    "click",
    function(){

        speechSynthesis.cancel();

    }
);


/* =========================================
   QR CODE
   ========================================= */

document
.getElementById("qrButton")
.addEventListener(
    "click",
    function(){

        const qr =
            document.getElementById(
                "qr"
            );

        if(
            qr.style.display ===
            "flex"
        ){

            qr.style.display =
                "none";

            this.textContent =
                "📱 SHOW QR";

            return;
        }

        qr.innerHTML = "";

        const image =
            document.createElement(
                "img"
            );

        image.width = 180;

        image.height = 180;

        image.alt =
            "NEXORA QR Code";

        image.src =
            "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=" +
            encodeURIComponent(
                window.location.href
            );

        qr.appendChild(
            image
        );

        qr.style.display =
            "flex";

        this.textContent =
            "❌ HIDE QR";

    }
);


/* =========================================
   KEYBOARD
   ========================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.code === "Space" &&
            document.activeElement.tagName !== "INPUT" &&
            document.activeElement.tagName !== "SELECT"
        ){

            event.preventDefault();

            startListening();
        }


        if(
            event.key === "Escape"
        ){

            speechSynthesis.cancel();

            if(
                listening &&
                recognition
            ){

                recognition.stop();
            }
        }
